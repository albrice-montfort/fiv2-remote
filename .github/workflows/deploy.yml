name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Generate index pages
        run: |
          echo "🔄 Génération automatique des index.html..."
          node generate-indexes.js
          echo "✅ Index générés avec succès"

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Aucun changement détecté"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "📝 Changements détectés, commit automatique..."
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git add assets/*/index.html
            git commit -m "🔄 Auto-update index pages

- Mise à jour automatique des index.html
- Ajout de nouveaux assets détectés
- Génération des listes de fichiers

Déployé automatiquement le $(date)"
            git push
          fi

      - name: Setup Pages
        if: steps.changes.outputs.changed == 'true'
        uses: actions/configure-pages@v4

      - name: Upload artifact
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
