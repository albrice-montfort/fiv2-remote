<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modèles 3D - Fractal Innov</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #181A33 0%, #0BA398 100%);
            color: white;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #66A22F, #0BA398);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .assets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .asset-item {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            transition: all 0.3s ease;
        }
        .asset-item:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.15);
        }
        .asset-preview {
            width: 100%;
            height: 150px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
            color: #66A22F;
        }
        .asset-name {
            font-weight: bold;
            margin-bottom: 10px;
            color: #66A22F;
        }
        .asset-details {
            font-size: 0.9em;
            opacity: 0.8;
            margin-bottom: 15px;
        }
        .download-btn {
            background: linear-gradient(45deg, #66A22F, #0BA398);
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 5px;
            font-size: 0.9em;
            display: inline-block;
            transition: transform 0.3s ease;
        }
        .download-btn:hover {
            transform: scale(1.05);
        }
        .back-link {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            backdrop-filter: blur(10px);
        }
        .back-link:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .empty-state {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .empty-state h3 {
            color: #66A22F;
            margin-bottom: 10px;
        }
        .info-box {
            background: rgba(11, 163, 152, 0.2);
            border: 1px solid #0BA398;
            border-radius: 10px;
            padding: 20px;
            margin-top: 30px;
        }
        .info-box h3 {
            color: #0BA398;
            margin-top: 0;
        }
        .refresh-btn {
            position: fixed;
            top: 80px;
            right: 20px;
            background: linear-gradient(45deg, #66A22F, #0BA398);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            z-index: 1000;
        }
        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }
        .refresh-btn:active {
            transform: translateY(0);
        }
        .refresh-btn.loading {
            opacity: 0.7;
            cursor: not-allowed;
        }
        .refresh-status {
            position: fixed;
            top: 140px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 12px;
            display: none;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <a href="../../index.html" class="back-link">← Retour à l'accueil</a>
    <button class="refresh-btn" onclick="refreshFiles()">🔄 Refresh Files</button>
    <div class="refresh-status" id="refreshStatus"></div>

    <div class="container">
        <div class="header">
            <h1>🎨 Modèles 3D</h1>
            <p>Modèles 3D optimisés pour le web</p>
        </div>

        
            <div class="empty-state">
                <h3>📁 Aucun fichier trouvé</h3>
                <p>Ajoutez des fichiers dans ce dossier et relancez le script</p>
                <p>Ils apparaîtront automatiquement ici !</p>
            </div>
        

        <div class="info-box">
            <h3>🔗 Base URL pour les modèles 3d</h3>
            <div style="background: rgba(0, 0, 0, 0.3); padding: 15px; border-radius: 5px; font-family: monospace; margin: 10px 0;">
                https://albrice-montfort.github.io/fiv2-remote/assets/models/
            </div>
        </div>
    </div>

    <script>
        // Configuration pour le refresh des fichiers
        const currentCategory = 'models';
        const baseUrl = 'https://albrice-montfort.github.io/fiv2-remote/';
        const supportedExtensions = [".glb",".gltf"];

        // Fonction pour afficher le statut
        function showStatus(message, isError = false) {
            const status = document.getElementById('refreshStatus');
            status.textContent = message;
            status.style.display = 'block';
            status.style.backgroundColor = isError ? 'rgba(255, 0, 0, 0.8)' : 'rgba(0, 0, 0, 0.8)';
            
            setTimeout(() => {
                status.style.display = 'none';
            }, 3000);
        }

        // Fonction pour générer le HTML d'un item
        function generateItemHTML(item) {
            const icons = {
                models: '🎨',
                textures: '🖼️',
                hdri: '🌌',
                audio: '🎵',
                chunks: '🧩'
            };
            
            const icon = icons[currentCategory] || '📄';
            const url = baseUrl + 'assets/' + currentCategory + '/' + item.name;
            
            return `
                <div class="asset-item">
                    <div class="asset-preview">${icon}</div>
                    <div class="asset-info">
                        <div class="asset-name">${item.name}</div>
                        <div class="asset-details">${item.extension.toUpperCase()} - ${item.size}</div>
                    </div>
                    <a href="${url}" class="download-btn" download>📥 Télécharger</a>
                </div>
            `;
        }

        // Fonction pour formater la taille des fichiers
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // Fonction principale pour rafraîchir les fichiers
        async function refreshFiles() {
            const btn = document.querySelector('.refresh-btn');
            const container = document.querySelector('.assets-grid') || document.querySelector('.empty-state')?.parentNode;
            
            if (!container) {
                showStatus('❌ Impossible de trouver le conteneur', true);
                return;
            }

            btn.classList.add('loading');
            btn.textContent = '🔄 Scanning...';
            showStatus('🔍 Recherche de nouveaux fichiers...');

            try {
                // Utiliser l'API GitHub pour lister les fichiers du dossier
                const apiUrl = `https://api.github.com/repos/albrice-montfort/fiv2-remote/contents/assets/${currentCategory}`;
                const response = await fetch(apiUrl);
                
                if (!response.ok) {
                    throw new Error('Impossible d\'accéder aux fichiers GitHub');
                }

                const files = await response.json();
                const validFiles = [];

                for (const file of files) {
                    if (file.type === 'file') {
                        const extension = '.' + file.name.split('.').pop().toLowerCase();
                        if (supportedExtensions.includes(extension)) {
                            // Obtenir la taille du fichier
                            const fileResponse = await fetch(file.download_url, { method: 'HEAD' });
                            const size = fileResponse.headers.get('content-length') || file.size;
                            
                            validFiles.push({
                                name: file.name,
                                size: formatFileSize(parseInt(size)),
                                extension: extension,
                                url: file.download_url
                            });
                        }
                    }
                }

                // Mettre à jour l'affichage
                if (validFiles.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <h3>📁 Aucun fichier trouvé</h3>
                            <p>Ajoutez des fichiers dans ce dossier et relancez le refresh</p>
                            <p>Ils apparaîtront automatiquement ici !</p>
                        </div>
                    `;
                } else {
                    container.innerHTML = `
                        <div class="assets-grid">
                            ${validFiles.map(file => generateItemHTML(file)).join('')}
                        </div>
                    `;
                }

                showStatus(`✅ ${validFiles.length} fichier(s) détecté(s)`);

            } catch (error) {
                console.error('Erreur lors du refresh:', error);
                showStatus('❌ Erreur: ' + error.message, true);
            } finally {
                btn.classList.remove('loading');
                btn.textContent = '🔄 Refresh Files';
            }
        }

        // Auto-refresh au chargement de la page (optionnel)
        // refreshFiles();
    </script>
</body>
</html>
