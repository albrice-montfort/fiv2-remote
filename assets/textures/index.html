<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Textures - Fractal Innov</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #181A33 0%, #0BA398 100%);
            color: white;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #66A22F, #0BA398);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .assets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .asset-item {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            transition: all 0.3s ease;
        }
        .asset-item:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.15);
        }
        .asset-preview {
            width: 100%;
            height: 150px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
            color: #66A22F;
        }
        .asset-name {
            font-weight: bold;
            margin-bottom: 10px;
            color: #66A22F;
        }
        .asset-details {
            font-size: 0.9em;
            opacity: 0.8;
            margin-bottom: 15px;
        }
        .download-btn {
            background: linear-gradient(45deg, #66A22F, #0BA398);
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 5px;
            font-size: 0.9em;
            display: inline-block;
            transition: transform 0.3s ease;
        }
        .download-btn:hover {
            transform: scale(1.05);
        }
        .back-link {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            backdrop-filter: blur(10px);
        }
        .back-link:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .empty-state {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .empty-state h3 {
            color: #66A22F;
            margin-bottom: 10px;
        }
        .info-box {
            background: rgba(11, 163, 152, 0.2);
            border: 1px solid #0BA398;
            border-radius: 10px;
            padding: 20px;
            margin-top: 30px;
        }
        .info-box h3 {
            color: #0BA398;
            margin-top: 0;
        }
    </style>
</head>
<body>
    <a href="../../index.html" class="back-link">← Retour à l'accueil</a>
    
    <div class="container">
        <div class="header">
            <h1>🖼️ Textures</h1>
            <p>Textures et images haute qualité</p>
        </div>

        
            <div class="empty-state">
                <h3>📁 Aucun fichier trouvé</h3>
                <p>Ajoutez des fichiers dans ce dossier et relancez le script</p>
                <p>Ils apparaîtront automatiquement ici !</p>
            </div>
        

        <div class="info-box">
            <h3>🔗 Base URL pour les textures</h3>
            <div style="background: rgba(0, 0, 0, 0.3); padding: 15px; border-radius: 5px; font-family: monospace; margin: 10px 0;">
                https://albrice-montfort.github.io/fiv2-remote/assets/textures/
            </div>
        </div>
    </div>
</body>
</html>
